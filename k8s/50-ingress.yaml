# TLS ends at Cloudflare, so Traefik listens on plain HTTP inside the cluster.
# Two Ingress objects because Traefik attaches middlewares per Ingress, not per
# path; Traefik prefers the longer path, so /api/messages gets the coach limit.
# The app answers at zabaione.minipi.net; its first address, fitness.minipi.net,
# only redirects there (the last two objects).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitnessai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: fitnessai-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: zabaione.minipi.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fitnessai
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitnessai-coach
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: fitnessai-coach-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: zabaione.minipi.net
      http:
        paths:
          - path: /api/messages
            pathType: Prefix
            backend:
              service:
                name: fitnessai
                port:
                  number: 8080
---
# A permanent redirect from the first address to the same path and query on the new
# one. Cloudflare Access covers both hostnames (home-cluster
# terraform/cloudflare/access.tf), so nobody reaches it without signing in. Traefik
# sees the URL as http:// because TLS ends at Cloudflare, hence https?. A URL that
# didn't match would fall through to the app, so the pattern ignores case and
# whatever the Host carries between the name and the path (a port, a trailing dot).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-zabaione
spec:
  redirectRegex:
    regex: '(?i)^https?://fitness\.minipi\.net[^/]*/(.*)'
    replacement: 'https://zabaione.minipi.net/${1}'
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitnessai-old-address
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: fitnessai-to-zabaione@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: fitness.minipi.net
      http:
        paths:
          - path: /
            pathType: Prefix
            # Required by the Ingress schema; the redirect answers first.
            backend:
              service:
                name: fitnessai
                port:
                  number: 8080
