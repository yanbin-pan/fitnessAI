# ssd is the NFS-backed class on rpi-01's SSD, backed up nightly to R2.
# NFS does not enforce ReadWriteOnce: one pod per SQLite file comes from replicas: 1,
# strategy: Recreate and the app's exclusive database lock (spec §14.4).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fitnessai-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ssd
  resources:
    requests:
      storage: 2Gi
