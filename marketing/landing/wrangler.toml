# Cloudflare Pages project for the public waitlist page at zabaione.app.
# Build: node build.mjs (writes dist/). Deploy: npx wrangler pages deploy.
name = "zabaione-waitlist"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "zabaione-waitlist"
# Created 2026-11-09 in WEUR (Western Europe).
database_id = "890683bd-9f32-43f5-ad4a-043b71a9d127"

# Secret, set with `npx wrangler pages secret put EXPORT_TOKEN`:
#   EXPORT_TOKEN  guards GET /api/waitlist?format=csv (the export)
